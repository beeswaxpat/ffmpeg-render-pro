name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# using GitHub OIDC: no secrets, no browser, no binary on a dev machine. The OIDC
# token proves this repo's identity, which authorizes the io.github.beeswaxpat/*
# namespace that server.json's name uses. The npm package is published separately
# (npm publish), so this workflow only does the registry step.
#
# Trigger: push a version tag (git tag v1.4.0 && git push origin v1.4.0), or run
# it manually from the Actions tab / `gh workflow run publish-mcp.yml`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher (pinned, checksum-verified)
        env:
          # Pinned release of modelcontextprotocol/registry; sha256 is for
          # mcp-publisher_linux_amd64.tar.gz from that release's checksums.txt.
          # Bump both together when upgrading.
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish
